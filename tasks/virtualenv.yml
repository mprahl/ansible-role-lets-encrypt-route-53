---
- name: install the virtualenv requirements (Red Hat 8+)
  ansible.builtin.yum:
    name:
    - gcc
    - python3-devel
    - python3-pip
    - python3-virtualenv
    - openssl-devel
    - libffi-devel
    state: present
  when:
  - ansible_os_family == 'RedHat'
  - ansible_distribution_major_version is version('8', '>=')
  tags:
  - install

- name: install virtualenv (MacOS)
  ansible.builtin.pip:
    name: virtualenv
    state: present
  when: ansible_os_family == 'Darwin'
  tags:
  - install

- name: install Python dependencies in a virtualenv (Red Hat 8+/MacOS)
  ansible.builtin.pip:
    name: "{{ ler53_item.name }}"
    state: "{{ ler53_item.state | default(omit) }}"
    version: "{{ ler53_item.version | default(omit) }}"
    virtualenv: "{{ ler53_account_key_dir }}/ansible-lets-encrypt-virtualenv"
    virtualenv_python: python3
    # Preserve system libraries such as SELinux bindings in the virtualenv on RHEL.
    virtualenv_site_packages: true
  loop:
  - name: boto3
  - name: botocore
  - name: cffi
  - name: cryptography
  - name: pyOpenSSL
  loop_control:
    loop_var: ler53_item
  tags:
  - install

- name: use the created virtualenv
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ ler53_account_key_dir }}/ansible-lets-encrypt-virtualenv/bin/python"
  tags:
  - install
